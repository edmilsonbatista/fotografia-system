<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="csrf-token" content="{{ csrf_token() }}" />
    <title>{% block title %}Sistema de Fotografia{% endblock %}</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
      rel="stylesheet"
    />
    <link
      href="{{ url_for('static', filename='css/style.css') }}"
      rel="stylesheet"
    />
    <link
      rel="icon"
      type="image/png"
      href="{{ url_for('static', filename='img/photoflow_icon.png') }}"
    />
    <script>
      if (localStorage.getItem("darkMode") === "true")
        document.documentElement.classList.add("dark-mode");
    </script>
    <style>
      html.dark-mode,
      html.dark-mode body {
        background-color: #0f0f23 !important;
        color: #e2e2f0 !important;
      }
      html.dark-mode .navbar {
        background: linear-gradient(
          135deg,
          #1a1a3e 0%,
          #0f0f23 100%
        ) !important;
      }
      html.dark-mode .card {
        background-color: #1a1a2e !important;
      }
      html.dark-mode .card-header {
        background-color: #1e1e38 !important;
        color: #e2e2f0 !important;
      }
    </style>
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
      <div class="container">
        <a class="navbar-brand" href="{{ url_for('dashboard') }}">
          <img
            src="{{ url_for('static', filename='img/photoflow_icon.png') }}"
            alt="FotoFlow"
            style="height: 50px; max-width: 200px; object-fit: contain"
          />
        </a>
        <div class="navbar-nav ms-auto">
          <a class="nav-link" href="{{ url_for('dashboard') }}">
            <i class="fas fa-chart-line"></i> Dashboard
          </a>
          <a class="nav-link" href="{{ url_for('listar_eventos') }}">
            <i class="fas fa-calendar"></i> Eventos
          </a>
          <a class="nav-link" href="{{ url_for('caixa') }}">
            <i class="fas fa-cash-register"></i> Caixa
          </a>
          <a class="nav-link" href="{{ url_for('importar') }}">
            <i class="fas fa-file-import"></i> Importar
          </a>
          {% if current_user.is_authenticated %} {% if current_user.is_admin %}
          <a class="nav-link" href="{{ url_for('listar_usuarios') }}">
            <i class="fas fa-users"></i> Usuários
          </a>
          {% endif %}
          <span class="nav-link text-light">
            <i class="fas fa-user"></i> {{ current_user.username }}
          </span>
          <a class="nav-link" href="{{ url_for('logout') }}">
            <i class="fas fa-sign-out-alt"></i> Sair
          </a>
          {% endif %}
          <button
            class="nav-link btn btn-link"
            onclick="toggleDarkMode()"
            title="Alternar tema"
            style="border: none"
          >
            <i id="darkModeIcon" class="fas fa-moon"></i>
          </button>
        </div>
      </div>
    </nav>

    <div class="container mt-4">{% block content %}{% endblock %}</div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@3.9.1/dist/chart.min.js"></script>
    <script src="{{ url_for('static', filename='js/csrf.js') }}"></script>
    <script src="{{ url_for('static', filename='js/darkmode.js') }}"></script>
    {% block scripts %}{% endblock %}
  </body>
</html>
